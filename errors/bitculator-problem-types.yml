generated: '2026-09-03'
method: searched
source: https://bitculator.com/en/documentation/api/v1
format: custom-envelope
note: >-
  Not RFC 9457 — every 4xx/5xx uses the provider's own stable envelope
  { "error": { "code", "message", "details" } } with Content-Type application/json. The docs
  instruct clients to match on error.code, not the message. Codes below are the ones the public
  docs and live probes actually show; the OpenAPI declares 422/404/403 responses inline.
envelope:
  shape: '{ "error": { "code": string, "message": string, "details": object? } }'
  content_type: application/json
problem_types:
  - code: validation
    http_status: 422
    title: The request parameters are invalid.
    detail: >-
      details.errors carries a per-field map of validation messages, e.g. {"per_page": ["The per
      page must not be greater than 250."]}. Exceeding a plan's per_page cap returns this rather
      than clamping.
    remediation: Fix the named parameters; respect the plan's per_page cap (Free 100, Starter/Pro 250).
    evidence: OpenAPI 422 response example on GET /api/v1/coins.
  - code: unauthenticated
    http_status: 401
    title: Missing or invalid API key.
    detail: 'Message observed live: ''Missing API key. Send it as an "Authorization: Bearer <key>" header.'''
    remediation: Create a key with the data-api ability in the developer console and send it as a Bearer header.
    evidence: Probed 2026-09-03 — POST https://bitculator.com/mcp without a key returned this envelope with HTTP 401.
  - code: not_found
    http_status: 404
    title: Resource not found.
    detail: 'Example from the docs: {"code": "not_found", "message": "Coin not found."}'
    remediation: Resolve slugs first (GET /coins or the MCP search_coins tool) before addressing detail endpoints.
    evidence: 404 response example on GET /api/v1/coins/{slug} in the API reference.
  - code: plan_required
    http_status: 403
    title: The endpoint or parameter window requires a higher plan.
    detail: >-
      details.required_plan names the plan, e.g. {"code": "plan_required", "message": "The 28-day
      rsi window requires the Starter plan or higher.", "details": {"required_plan": "starter"}}.
    remediation: Upgrade the plan or stay within the windows/endpoints your plan includes.
    evidence: 403 response example on the indicator endpoints in the API reference.
  - code: rate_limited
    http_status: null
    title: Per-minute burst limit or monthly quota exhausted.
    detail: >-
      The MCP docs state over-quota tool calls return a rate_limited error "that tells the
      assistant when the pool resets". The HTTP status code on exhaustion is not explicitly stated
      in the public docs; X-Quota-Reset carries the reset instant on every response.
    remediation: Watch X-Quota-Used/X-Quota-Remaining against X-Quota-Limit and back off until X-Quota-Reset.
    evidence: https://bitculator.com/en/documentation/mcp/v1 (Quota & limits section).
