source: https://bitculator.com/en/documentation/embed/v1
note: >-
  Embed widgets are a distinct product surface from the Data API and SDKs: self-contained iframe
  pages under /{locale}/embed/... with their own key class (the "api" ability, passed as
  ?embed_key= query parameter — public by design) and their own quota (Free ships 10,000 embed
  loads/month, separate from the Data API pool). Keyed requests must come from a domain
  allow-listed in the developer console; keyless "anonymous mode" works for quick tests but is
  limited per visitor IP. Widgets honour the {locale} path segment (19 languages) and the theme
  cookie or ?theme=dark. No script tag needed — pure iframe.
loader: iframe (no JavaScript required)
families:
  - name: Converter
    widgets:
      - name: Currency converter
        path: /{locale}/embed/converter/{from}/{to}
        example: https://bitculator.com/en/embed/converter/bitcoin/usd?embed_key=YOUR_EMBED_KEY
  - name: Charts
