                      indicator:
                        type: string
                        example: mfi
                      period:
                        type: integer
                        example: 14
                      count:
                        type: integer
                        example: 1
      tags:
      - Indicators
  /api/v1/coins/{slug}/indicators/williams-r:
    parameters:
    - in: path
      name: slug
      description: The coin slug.
      example: bitcoin
      required: true
      schema:
        type: string
    get:
      summary: Williams %R
      operationId: williamsR
      description: 'Daily Williams %R — a momentum oscillator bounded −100–0 that maps where the

        close sits within the recent high-low range; above −20 overbought, below −80

        oversold. Windows: 14, 20, 50 days (default 14).'
      parameters:
      - in: query
        name: period
        description: Window length — one of 14, 20, 50 (default 14).
        example: 14
        required: false
        schema:
          type: integer
          description: Window length — one of 14, 20, 50 (default 14).
          example: 14
      - in: query
        name: start
        description: ISO date lower bound.
