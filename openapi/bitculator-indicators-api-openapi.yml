                      value: -83.5
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          example: '2026-06-14'
                        value:
                          type: number
                          example: -83.5
                  meta:
                    type: object
                    properties:
                      coin:
                        type: string
                        example: bitcoin
                      indicator:
                        type: string
                        example: cci
                      period:
                        type: integer
                        example: 20
                      count:
                        type: integer
                        example: 1
      tags:
      - Indicators
