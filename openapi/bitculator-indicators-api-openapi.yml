        reversals. Windows: 20, 50, 100 days (default 20).'
      parameters:
      - in: query
        name: period
        description: Window length — one of 20, 50, 100 (default 20).
        example: 20
        required: false
        schema:
          type: integer
          description: Window length — one of 20, 50, 100 (default 20).
          example: 20
      - in: query
        name: start
        description: ISO date lower bound.
        example: '2026-06-01'
        required: false
        schema:
          type: string
          description: ISO date lower bound.
          example: '2026-06-01'
      - in: query
