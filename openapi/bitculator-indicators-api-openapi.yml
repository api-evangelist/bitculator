    get:
      summary: MFI (Money Flow Index)
      operationId: mFIMoneyFlowIndex
      description: 'Daily Money Flow Index — a volume-weighted RSI (0–100) that factors trading

        volume into momentum, often called "volume RSI"; above 80 overbought, below

        20 oversold. Windows: 7, 14, 28 days (default 14).'
      parameters:
      - in: query
        name: period
        description: Window length — one of 7, 14, 28 (default 14).
        example: 14
        required: false
        schema:
          type: integer
          description: Window length — one of 7, 14, 28 (default 14).
          example: 14
      - in: query
        name: start
        description: ISO date lower bound.
        example: '2026-06-01'
        required: false
        schema:
          type: string
          description: ISO date lower bound.
          example: '2026-06-01'
      - in: query
