openapi: 3.2.0
info:
  title: Bitculator Data Indicators API
  description: 'Programmatic access to Bitculator market data: coins, prices, history, exchanges, trust scores, tickers, pairs, wallets, sentiment, technical indicators, liquidations, editorial content, and calculators.'
  version: 1.0.0
servers:
- url: https://bitculator.com
security:
- default: []
tags:
- name: Indicators
  description: Per-coin technical indicators.
paths:
  /api/v1/coins/{slug}/indicators:
    parameters:
    - in: path
      name: slug
      description: The coin slug.
      example: bitcoin
      required: true
      schema:
        type: string
    get:
      summary: Indicator snapshot
      operationId: indicatorSnapshot
      description: 'The multi-indicator snapshot — every indicator category''s latest `state`

        (bullish/bearish/sheepish…), `score` and raw `data`, in one payload. Ideal

        for a dashboard at-a-glance read; use the dedicated per-indicator endpoints

        below for full daily history.'
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                  - indicator: OBV
                    state: bearish
                    score: -1
                    data:
                      value: 1755907904411
                      window: 21
                  - indicator: macd
                    state: bullish
                    score: 1
                    data:
                      value: -2811.87686067
                      signal: -3364.35539147
                      histogram: 552.4785308
                  meta:
                    coin: bitcoin
                properties:
                  data:
                    type: array
                    example:
                    - indicator: OBV
                      state: bearish
                      score: -1
                      data:
                        value: 1755907904411
                        window: 21
                    - indicator: macd
                      state: bullish
                      score: 1
                      data:
                        value: -2811.87686067
                        signal: -3364.35539147
                        histogram: 552.4785308
                    items:
                      type: object
                      properties:
                        indicator:
                          type: string
                          example: OBV
                        state:
                          type: string
                          example: bearish
                        score:
                          type: integer
                          example: -1
                        data:
                          type: object
                          properties:
                            value:
                              type: integer
                              example: 1755907904411
                            window:
                              type: integer
                              example: 21
                  meta:
                    type: object
                    properties:
                      coin:
                        type: string
                        example: bitcoin
        '404':
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: not_found
                    message: No indicator data for this coin yet.
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: not_found
                      message:
                        type: string
                        example: No indicator data for this coin yet.
      tags:
      - Indicators
  /api/v1/coins/{slug}/indicators/rsi:
    parameters:
    - in: path
      name: slug
      description: The coin slug.
      example: bitcoin
      required: true
      schema:
        type: string
    get:
      summary: RSI (Relative Strength Index)
      operationId: rSIRelativeStrengthIndex
      description: 'Daily Relative Strength Index — a momentum oscillator bounded 0–100 that

        measures the speed and magnitude of recent price moves. Above 70 is

        conventionally overbought, below 30 oversold. Windows: 7, 14, 21, 28 days

        (default 14) — the 21- and 28-day windows require the Starter plan or higher.

        Young coins return leading warm-up `null`s.'
      parameters:
      - in: query
        name: period
        description: Window length — one of 7, 14, 21, 28 (default 14).
        example: 14
        required: false
        schema:
          type: integer
          description: Window length — one of 7, 14, 21, 28 (default 14).
          example: 14
      - in: query
        name: start
        description: ISO date lower bound.
        example: '2026-06-01'
        required: false
        schema:
          type: string
          description: ISO date lower bound.
          example: '2026-06-01'
      - in: query
        name: end
        description: ISO date upper bound.
        example: '2026-06-30'
        required: false
        schema:
          type: string
          description: ISO date upper bound.
          example: '2026-06-30'
      - in: query
        name: limit
        description: Max rows (1–1000, default 365).
        example: 30
        required: false
        schema:
          type: integer
          description: Max rows (1–1000, default 365).
          example: 30
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                  - date: '2026-06-14'
                    value: 42
                  - date: '2026-06-15'
                    value: 46
                  meta:
                    coin: bitcoin
                    indicator: rsi
                    period: 14
                    count: 2
                properties:
                  data:
                    type: array
                    example:
                    - date: '2026-06-14'
                      value: 42
                    - date: '2026-06-15'
                      value: 46
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          example: '2026-06-14'
                        value:
                          type: integer
                          example: 42
                  meta:
                    type: object
                    properties:
                      coin:
                        type: string
                        example: bitcoin
                      indicator:
                        type: string
                        example: rsi
                      period:
                        type: integer
                        example: 14
                      count:
                        type: integer
                        example: 2
        '403':
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: plan_required
                    message: The 28-day rsi window requires the Starter plan or higher.
                    details:
                      required_plan: starter
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: plan_required
                      message:
                        type: string
                        example: The 28-day rsi window requires the Starter plan or higher.
                      details:
                        type: object
                        properties:
                          required_plan:
                            type: string
                            example: starter
      tags:
      - Indicators
  /api/v1/coins/{slug}/indicators/stoch-rsi:
    parameters:
    - in: path
      name: slug
      description: The coin slug.
      example: bitcoin
      required: true
      schema:
        type: string
    get:
      summary: Stochastic RSI
      operationId: stochasticRSI
      description: 'Daily Stochastic RSI — applies the stochastic oscillator to RSI itself,

        giving a faster, more sensitive 0–100 momentum read with `%K` and `%D` lines

        that cross to signal turns. Windows: 7, 14, 21, 28 days (default 14) — the

        21- and 28-day windows require the Starter plan or higher.'
      parameters:
      - in: query
        name: period
        description: Window length — one of 7, 14, 21, 28 (default 14).
        example: 14
        required: false
        schema:
          type: integer
          description: Window length — one of 7, 14, 21, 28 (default 14).
          example: 14
      - in: query
        name: start
        description: ISO date lower bound.
        example: '2026-06-01'
        required: false
        schema:
          type: string
          description: ISO date lower bound.
          example: '2026-06-01'
      - in: query
        name: end
        description: ISO date upper bound.
        example: '2026-06-30'
        required: false
        schema:
          type: string
          description: ISO date upper bound.
          example: '2026-06-30'
      - in: query
        name: limit
        description: Max rows (1–1000, default 365).
        example: 30
        required: false
        schema:
          type: integer
          description: Max rows (1–1000, default 365).
          example: 30
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                  - date: '2026-06-14'
                    k: 18.4
                    d: 22.1
                  meta:
                    coin: bitcoin
                    indicator: stoch-rsi
                    period: 14
                    count: 1
                properties:
                  data:
                    type: array
                    example:
                    - date: '2026-06-14'
                      k: 18.4
                      d: 22.1
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          example: '2026-06-14'
                        k:
                          type: number
                          example: 18.4
                        d:
                          type: number
                          example: 22.1
                  meta:
                    type: object
                    properties:
                      coin:
                        type: string
                        example: bitcoin
                      indicator:
                        type: string
                        example: stoch-rsi
                      period:
                        type: integer
                        example: 14
                      count:
                        type: integer
                        example: 1
        '403':
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: plan_required
                    message: The 28-day stoch-rsi window requires the Starter plan or higher.
                    details:
                      required_plan: starter
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: plan_required
                      message:
                        type: string
                        example: The 28-day stoch-rsi window requires the Starter plan or higher.
                      details:
                        type: object
                        properties:
                          required_plan:
                            type: string
                            example: starter
      tags:
      - Indicators
  /api/v1/coins/{slug}/indicators/sma:
    parameters:
    - in: path
      name: slug
      description: The coin slug.
      example: bitcoin
      required: true
      schema:
        type: string
    get:
      summary: SMA (Simple Moving Average)
      operationId: sMASimpleMovingAverage
      description: 'Daily Simple Moving Average — the arithmetic mean of the closing price over

        the window, the classic trend baseline traders read for support, resistance

        and golden/death crosses. Windows: 50, 100, 200 days (default 50). Values are

        decimal strings on the price scale.'
      parameters:
      - in: query
        name: period
        description: Window length — one of 50, 100, 200 (default 50).
        example: 50
        required: false
        schema:
          type: integer
          description: Window length — one of 50, 100, 200 (default 50).
          example: 50
      - in: query
        name: start
        description: ISO date lower bound.
        example: '2026-06-01'
        required: false
        schema:
          type: string
          description: ISO date lower bound.
          example: '2026-06-01'
      - in: query
        name: end
        description: ISO date upper bound.
        example: '2026-06-30'
        required: false
        schema:
          type: string
          description: ISO date upper bound.
          example: '2026-06-30'
      - in: query
        name: limit
        description: Max rows (1–1000, default 365).
        example: 30
        required: false
        schema:
          type: integer
          description: Max rows (1–1000, default 365).
          example: 30
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                  - date: '2026-06-14'
                    value: '63120.44821000'
                  meta:
                    coin: bitcoin
                    indicator: sma
                    period: 50
                    count: 1
                properties:
                  data:
                    type: array
                    example:
                    - date: '2026-06-14'
                      value: '63120.44821000'
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          example: '2026-06-14'
                        value:
                          type: string
                          example: '63120.44821000'
                  meta:
                    type: object
                    properties:
                      coin:
                        type: string
                        example: bitcoin
                      indicator:
                        type: string
                        example: sma
                      period:
                        type: integer
                        example: 50
                      count:
                        type: integer
                        example: 1
      tags:
      - Indicators
  /api/v1/coins/{slug}/indicators/cci:
    parameters:
    - in: path
