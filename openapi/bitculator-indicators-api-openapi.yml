        description: ISO date upper bound.
        example: '2026-06-30'
        required: false
        schema:
          type: string
          description: ISO date upper bound.
          example: '2026-06-30'
      - in: query
        name: limit
        description: Max rows (1–1000, default 365).
        example: 30
        required: false
        schema:
          type: integer
          description: Max rows (1–1000, default 365).
          example: 30
      responses:
        '200':
          description: ''
          content:
