  /api/v1/coins/{slug}/sparkline:
    parameters:
    - in: path
      name: slug
      description: The coin slug.
      example: bitcoin
      required: true
      schema:
        type: string
    get:
      summary: Coin sparkline
      operationId: coinSparkline
      description: 'A compact price series for the coin over the chosen `period`, for drawing

        sparklines.


        `points` is a sample of at most 480 readings, oldest first, each a decimal-string

        `price` at an ISO-8601 `time`. `low` and `high` are the true extremes of the whole

        period — they bound every point, but need not appear among the sampled ones.

        `change` is the move across the period in PERCENT (`1.25` means +1.25%).'
      parameters:
      - in: query
        name: period
        description: 24h, 7d, 30d, 60d, 90d, 180d or 365d (default 7d).
        example: 7d
        required: false
        schema:
          type:
          - string
          - 'null'
          description: 24h, 7d, 30d, 60d, 90d, 180d or 365d (default 7d).
          example: 7d
      responses: []
      tags:
      - Coins
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: Create a Data API key in your <a href="/user/developer/api">developer console</a> — keys are Bearer-only and carry the <code>data-api</code> ability. Keep them server-side; they are never meant for client-side embedding.
