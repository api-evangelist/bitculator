  /api/v1/coins/{slug}/history:
    parameters:
    - in: path
      name: slug
      description: The coin slug.
      example: bitcoin
      required: true
      schema:
        type: string
    get:
      summary: Candle history
      operationId: candleHistory
      description: 'Per-coin OHLC + volume + marketcap time series. Pick `interval`: minutely,

        half-hourly, hourly or daily. Retention is a hard property of the rollup

        pipeline — minutely 8 days, half-hourly 3 months, hourly 6 months, daily forever;

        requests beyond a window return what exists. When a `limit` is set you get the

        MOST RECENT N rows in the window, emitted oldest-first. Prices are decimal

        strings.'
      parameters:
      - in: query
        name: interval
        description: minutely, half-hourly, hourly or daily (default daily).
        example: daily
        required: false
        schema:
          type: string
          description: minutely, half-hourly, hourly or daily (default daily).
          example: daily
      - in: query
        name: start
        description: ISO date/time lower bound.
        example: '2026-06-01'
        required: false
        schema:
          type: string
          description: ISO date/time lower bound.
          example: '2026-06-01'
      - in: query
        name: end
        description: ISO date/time upper bound (a date-only value means through that day).
        example: '2026-06-30'
        required: false
        schema:
          type: string
          description: ISO date/time upper bound (a date-only value means through that day).
          example: '2026-06-30'
      - in: query
        name: limit
        description: Max rows (1–2000, default 1000).
        example: 30
        required: false
        schema:
          type: integer
          description: Max rows (1–2000, default 1000).
          example: 30
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                  - time: '2026-06-14T23:01:01+00:00'
                    price: '65481.259006434'
                    open: '64193.294621057'
                    high: '65513.599862059'
                    low: '63528.138075558'
                    close: '65481.259006434'
                    volume_24h: 3795657715
                    marketcap: 1303678106704.5
                  meta:
                    coin: bitcoin
                    interval: daily
                    count: 1
                    retention: full history
                properties:
                  data:
                    type: array
                    example:
                    - time: '2026-06-14T23:01:01+00:00'
                      price: '65481.259006434'
                      open: '64193.294621057'
                      high: '65513.599862059'
                      low: '63528.138075558'
                      close: '65481.259006434'
                      volume_24h: 3795657715
                      marketcap: 1303678106704.5
                    items:
                      type: object
                      properties:
                        time:
                          type: string
                          example: '2026-06-14T23:01:01+00:00'
                        price:
                          type: string
                          example: '65481.259006434'
                        open:
                          type: string
                          example: '64193.294621057'
                        high:
                          type: string
                          example: '65513.599862059'
                        low:
                          type: string
                          example: '63528.138075558'
                        close:
                          type: string
                          example: '65481.259006434'
                        volume_24h:
                          type: integer
                          example: 3795657715
                        marketcap:
                          type: number
                          example: 1303678106704.5
                  meta:
                    type: object
                    properties:
                      coin:
                        type: string
                        example: bitcoin
                      interval:
                        type: string
                        example: daily
                      count:
                        type: integer
                        example: 1
                      retention:
                        type: string
                        example: full history
        '404':
          description: ''
          content:
            application/json:
