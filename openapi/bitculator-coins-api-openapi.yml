openapi: 3.2.0
info:
  title: Bitculator Data Coins API
  description: 'Programmatic access to Bitculator market data: coins, prices, history, exchanges, trust scores, tickers, pairs, wallets, sentiment, technical indicators, liquidations, editorial content, and calculators.'
  version: 1.0.0
servers:
- url: https://bitculator.com
security:
- default: []
tags:
- name: Coins
  description: 'Ranked coin and token market data: paginated listings, single-coin detail, movers

    (gainers/losers), recently-added, trending, and per-coin time series. Prices,

    marketcap and supply are decimal STRINGS (floats can''t carry market precision);

    percentage changes, ranks and counts are numbers.'
paths:
  /api/v1/coins:
    get:
      summary: List coins
      operationId: listCoins
      description: 'Ranked coins with prices, filters and selectors, paginated with Laravel''s

        `links` + `meta` envelope. Prices, marketcap and circulating_supply are decimal

        strings; changes and ranks are numbers.'
      parameters:
      - in: query
        name: page
        description: Page number (1-based). Must be at least 1.
        example: 1
        required: false
        schema:
          type:
          - integer
          - 'null'
          description: Page number (1-based). Must be at least 1.
          example: 1
      - in: query
        name: per_page
        description: Rows per page. The cap is plan-based (Free 100, Starter/Pro 250); exceeding it returns 422 rather than clamping. Must be at least 1. Must not be greater than 100.
        example: 50
        required: false
        schema:
          type:
          - integer
          - 'null'
          description: Rows per page. The cap is plan-based (Free 100, Starter/Pro 250); exceeding it returns 422 rather than clamping. Must be at least 1. Must not be greater than 100.
          example: 50
      - in: query
        name: type
        description: 'Restrict to a single asset type: coin or token.'
        example: coin
        required: false
        schema:
          type:
          - string
          - 'null'
          description: 'Restrict to a single asset type: coin or token.'
          example: coin
          enum:
          - coin
          - token
      - in: query
        name: status
        description: 'Listing status: active, delisted, untracked, progressing, awaiting or preparing. Defaults to all public statuses.'
        example: active
        required: false
        schema:
          type:
          - string
          - 'null'
          description: 'Listing status: active, delisted, untracked, progressing, awaiting or preparing. Defaults to all public statuses.'
          example: active
          enum:
          - active
          - delisted
          - untracked
          - progressing
          - awaiting
          - preparing
      - in: query
        name: search
        description: Free-text match on name or symbol. Must not be greater than 100 characters.
        example: bitcoin
        required: false
        schema:
          type:
          - string
          - 'null'
          description: Free-text match on name or symbol. Must not be greater than 100 characters.
          example: bitcoin
      - in: query
        name: min_price
        description: Only coins priced at or above this USD value. Must be at least 0.
        example: 0.5
        required: false
        schema:
          type:
          - number
          - 'null'
          description: Only coins priced at or above this USD value. Must be at least 0.
          example: 0.5
      - in: query
        name: max_price
        description: Only coins priced at or below this USD value. Must be at least 0.
        example: 100000
        required: false
        schema:
          type:
          - number
          - 'null'
          description: Only coins priced at or below this USD value. Must be at least 0.
          example: 100000
      - in: query
        name: min_marketcap
        description: Only coins with a USD marketcap at or above this value. Must be at least 0.
        example: 1000000
        required: false
        schema:
          type:
          - number
          - 'null'
          description: Only coins with a USD marketcap at or above this value. Must be at least 0.
          example: 1000000
      - in: query
        name: max_marketcap
        description: Only coins with a USD marketcap at or below this value. Must be at least 0.
        example: 5000000000000
        required: false
        schema:
          type:
          - number
          - 'null'
          description: Only coins with a USD marketcap at or below this value. Must be at least 0.
          example: 5000000000000
      - in: query
        name: min_volume
        description: Only coins with 24h USD volume at or above this value. Must be at least 0.
        example: 1000000
        required: false
        schema:
          type:
          - number
          - 'null'
          description: Only coins with 24h USD volume at or above this value. Must be at least 0.
          example: 1000000
      - in: query
        name: max_volume
        description: Only coins with 24h USD volume at or below this value. Must be at least 0.
        example: 100000000000
        required: false
        schema:
          type:
          - number
          - 'null'
          description: Only coins with 24h USD volume at or below this value. Must be at least 0.
          example: 100000000000
      - in: query
        name: ids
        description: Filter to specific coin ids (CSV, up to 100 selectors combined with slugs/symbols). Must not be greater than 1000 characters.
        example: 38,39
        required: false
        schema:
          type:
          - string
          - 'null'
          description: Filter to specific coin ids (CSV, up to 100 selectors combined with slugs/symbols). Must not be greater than 1000 characters.
          example: 38,39
      - in: query
        name: slugs
        description: Filter to specific coin slugs (CSV, up to 100 selectors combined). Must not be greater than 2000 characters.
        example: bitcoin,ethereum
        required: false
        schema:
          type:
          - string
          - 'null'
          description: Filter to specific coin slugs (CSV, up to 100 selectors combined). Must not be greater than 2000 characters.
          example: bitcoin,ethereum
      - in: query
        name: symbols
        description: Filter to specific coin symbols (CSV, case-insensitive, up to 100 selectors combined). Must not be greater than 1000 characters.
        example: BTC,ETH
        required: false
        schema:
          type:
          - string
          - 'null'
          description: Filter to specific coin symbols (CSV, case-insensitive, up to 100 selectors combined). Must not be greater than 1000 characters.
          example: BTC,ETH
      - in: query
        name: sort
        description: 'Comma-separated sort fields; prefix with - for descending. Sortable: marketcap, rank, price, volume_24h, change_24h, change_7d. Must not be greater than 100 characters.'
        example: -marketcap
        required: false
        schema:
          type:
          - string
          - 'null'
          description: 'Comma-separated sort fields; prefix with - for descending. Sortable: marketcap, rank, price, volume_24h, change_24h, change_7d. Must not be greater than 100 characters.'
          example: -marketcap
      - in: query
        name: interval
        description: 'Movers window for /coins/gainers and /coins/losers only: 24h or 7d.'
        example: 24h
        required: false
        schema:
          type:
          - string
          - 'null'
          description: 'Movers window for /coins/gainers and /coins/losers only: 24h or 7d.'
          example: 24h
          enum:
          - 24h
          - 7d
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                  - id: 38
                    slug: bitcoin
                    name: Bitcoin
                    symbol: BTC
                    rank: 1
                    price: '63520.780763913'
                    marketcap: 1264646594448.5
                    volume_24h: 5345161962
                    change_24h: 1.35
                    change_7d: 4.98
                    change_rank_24h: 0
                    change_rank_7d: 0
                    circulating_supply: '19909179'
                    logo: https://bitculator.com/storage/media/logo/bitcoin.png
                    listed_at: '2025-03-15T17:00:43+00:00'
                    last_updated: '2026-06-27T10:34:17+00:00'
                  links:
                    first: https://bitculator.com/api/v1/coins?page=1
                    last: https://bitculator.com/api/v1/coins?page=3
                    prev: null
                    next: https://bitculator.com/api/v1/coins?page=2
                  meta:
                    current_page: 1
                    from: 1
                    last_page: 3
                    per_page: 50
                    to: 50
                    total: 134
                properties:
                  data:
                    type: array
                    example:
                    - id: 38
                      slug: bitcoin
                      name: Bitcoin
                      symbol: BTC
                      rank: 1
                      price: '63520.780763913'
                      marketcap: 1264646594448.5
                      volume_24h: 5345161962
                      change_24h: 1.35
                      change_7d: 4.98
                      change_rank_24h: 0
                      change_rank_7d: 0
                      circulating_supply: '19909179'
                      logo: https://bitculator.com/storage/media/logo/bitcoin.png
                      listed_at: '2025-03-15T17:00:43+00:00'
                      last_updated: '2026-06-27T10:34:17+00:00'
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 38
                        slug:
                          type: string
                          example: bitcoin
                        name:
                          type: string
                          example: Bitcoin
                        symbol:
                          type: string
                          example: BTC
                        rank:
                          type: integer
                          example: 1
                        price:
                          type: string
                          example: '63520.780763913'
                        marketcap:
                          type: number
                          example: 1264646594448.5
                        volume_24h:
                          type: integer
                          example: 5345161962
                        change_24h:
                          type: number
                          example: 1.35
                        change_7d:
                          type: number
                          example: 4.98
                        change_rank_24h:
                          type: integer
                          example: 0
                        change_rank_7d:
                          type: integer
                          example: 0
                        circulating_supply:
                          type: string
                          example: '19909179'
                        logo:
                          type: string
                          example: https://bitculator.com/storage/media/logo/bitcoin.png
                        listed_at:
                          type: string
                          example: '2025-03-15T17:00:43+00:00'
                        last_updated:
                          type: string
                          example: '2026-06-27T10:34:17+00:00'
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                        example: https://bitculator.com/api/v1/coins?page=1
                      last:
                        type: string
                        example: https://bitculator.com/api/v1/coins?page=3
                      prev:
                        type:
                        - string
                        - 'null'
                        example: null
                      next:
                        type: string
                        example: https://bitculator.com/api/v1/coins?page=2
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      from:
                        type: integer
                        example: 1
                      last_page:
                        type: integer
                        example: 3
                      per_page:
                        type: integer
                        example: 50
                      to:
                        type: integer
                        example: 50
                      total:
                        type: integer
                        example: 134
        '422':
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: validation
                    message: The request parameters are invalid.
                    details:
                      errors:
                        per_page:
                        - The per page must not be greater than 250.
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: validation
                      message:
                        type: string
                        example: The request parameters are invalid.
                      details:
                        type: object
                        properties:
                          errors:
                            type: object
                            properties:
                              per_page:
                                type: array
                                example:
                                - The per page must not be greater than 250.
                                items:
                                  type: string
      tags:
      - Coins
